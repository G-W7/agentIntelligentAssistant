[project]
name = "agent-assistant"
version = "0.1.0"
description = "多 Agent 协作 + RAG + 联网搜索的企业级智能助手"
requires-python = ">=3.13"
dependencies = [
    # Web 框架
    "fastapi>=0.148.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # 前端
    "gradio>=5.0.0",
    "httpx>=0.27.0",
    # Agent 编排
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    # 存储
    "pymilvus>=2.6.0,<2.7.0",
    "psycopg2-binary>=2.9.10",
    # 认证
    "bcrypt>=4.0",
    "pyjwt>=2.8.0",
    # 工具
    "tavily-python>=0.5.0",
    "mineru-open-sdk>=0.2.0",
]

[project.optional-dependencies]
# EMBEDDING_PROVIDER=huggingface 时安装：uv sync --extra huggingface
huggingface = [
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
]
# EMBEDDING_PROVIDER=dashscope 时安装：uv sync --extra dashscope
dashscope = [
    "dashscope>=1.20.0",
    "aiohttp>=3.9.0",
]
# 可观测性追踪，安装：uv sync --extra langfuse
# 注意：<5.0.0 是因为 SDK v5 要求 langchain-core>=1，本项目仍用 0.3.x
langfuse = [
    "langfuse>=3.0.0,<5.0.0",
]
# 测试与覆盖率，安装：uv sync --extra dev
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "coverage>=7.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
